# Local validation entry point: act -W npu_e2e_test_a3.yml
name: A3 local NPU e2e tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  npu_tests:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 360
    container:
      image: ghcr.io/xssty123/veomni-ascend-candidate@sha256:33a0777d684a06fb812992a06d87e533b6f6f8c58b382c66f11373450cd7b73f
      volumes:
        - /usr/local/dcmi:/usr/local/dcmi
        - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
        - /usr/local/Ascend/driver:/usr/local/Ascend/driver
        - /etc/ascend_install.info:/etc/ascend_install.info:ro
        - /mnt/veomni_ci:/mnt/veomni_ci:ro
      options: >-
        --cap-add=ALL --shm-size=16g
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --device=/dev/davinci0 --device=/dev/davinci1 --device=/dev/davinci2 --device=/dev/davinci3
        --device=/dev/davinci4 --device=/dev/davinci5 --device=/dev/davinci6 --device=/dev/davinci7
    env:
      ASCEND_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      CI_HF_MODELS_DIR: /mnt/veomni_ci/models
      CI_SAMPLES_DIR: /mnt/veomni_ci/datasets/custom_data/samples
      CI_DATASET_DIR: /mnt/veomni_ci/datasets
      UV_HTTP_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Restore candidate environment
        shell: bash
        run: bash scripts/ci/npu/setup_candidate.sh a3
      - name: Run candidate e2e
        shell: bash
        run: bash scripts/ci/npu/run_candidate.sh a3 e2e
