name: docker-build-ascend-a2

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: Version prefix for the Quay image tag
        type: string
        required: true
        default: v0.1.12

permissions:
  contents: read
  packages: write

env:
  QUAY_REPO: quay.io/ascend/veomni
  CACHE_REPO: ghcr.io/xssty123/veomni
  ARTIFACT_PREFIX: ascend-a2-digest

jobs:
  build-push-digest:
    name: Build ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    environment: quay-production
    permissions:
      packages: write
      contents: read
    if: ${{ github.repository == 'xssty123/VeOmni' }}
    strategy:
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            tag: amd64
            dockerfile: ./docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_910b.x86
          - arch: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
            dockerfile: ./docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_910b.arm

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to GHCR (for cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute cache tag
        id: cache-tag
        run: |
          echo "value=buildcache-a2-${{ matrix.tag }}" >> $GITHUB_OUTPUT

      - name: Build and push (by digest)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.arch }}
          outputs: type=image,name=${{ env.QUAY_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE_REPO }}:${{ steps.cache-tag.outputs.value }}
          cache-to: type=registry,ref=${{ env.CACHE_REPO }}:${{ steps.cache-tag.outputs.value }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    runs-on: ubuntu-latest
    environment: quay-production
    needs: build-push-digest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          merge-multiple: true

      - name: Get base image name & tag
        id: base_image
        run: |
          BASE_IMAGE_FULL=$(grep '^FROM' ./docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_910b.x86 | head -1 | cut -d' ' -f2)
          BASE_IMAGE_TAG=$(echo "$BASE_IMAGE_FULL" | cut -d':' -f2)
          NEW_IMAGE_NAME="veomni-$BASE_IMAGE_TAG"
          echo "base_image_tag=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "new_image_name=$NEW_IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Compute product-based Quay tag
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          tag=$(python3 docker/ascend/image_tag.py \
            --dockerfile docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_910b.x86 \
            --version "$IMAGE_VERSION" --product 910b)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge and push multi-arch image
        env:
          IMAGE: ${{ env.QUAY_REPO }}
          TAG: ${{ env.QUAY_REPO }}:${{ steps.version.outputs.tag }}
        run: |
          DIGESTS=$(printf "$IMAGE@sha256:%s " $(ls ${{ runner.temp }}/digests))
          docker buildx imagetools create -t $TAG $DIGESTS
          echo "✅ Multi-arch image published: $TAG"
