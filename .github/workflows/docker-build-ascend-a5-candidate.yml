name: docker-build-ascend-a5-candidate
run-name: CANN 9.2.1 a5 ${{ inputs.mode || 'full' }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full image build, KDA diagnostic or full FLA wheel diagnostic
        type: choice
        default: full
        options:
          - full
          - diagnose-kda
          - diagnose-fla

permissions:
  contents: read

env:
  TARGET: a5
  IMAGE: ghcr.io/xssty123/veomni-ascend-candidate
  FLA_COMMIT: a7c608f2e3f828779ceeec1fcf155a6e37ede83c

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-a5
  cancel-in-progress: false

jobs:
  build-candidate:
    if: github.repository == 'xssty123/VeOmni' && inputs.mode == 'full'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout Docker candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check build source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "git checkout --detach $FLA_COMMIT" "docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_${TARGET}"

      - name: Compute unique candidate tag
        id: image
        shell: bash
        run: |
          TAG="${TARGET}-cann9.2.1-torch_npu2.10.0.post7-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=134217728
            env.BUILDKIT_STEP_LOG_MAX_SPEED=1048576

      - name: Login to candidate GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start build resource logging
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/${TARGET}-build-started-at"
          nohup bash -c '
            while true; do
              date -u +"%Y-%m-%dT%H:%M:%SZ"
              free -h
              df -h / /var/lib/docker
              ps -eo pid,ppid,comm,%cpu,%mem,rss --sort=-rss | sed -n "1,26p"
              for file in /proc/pressure/memory /sys/fs/cgroup/memory.events; do
                if [ -r "$file" ]; then
                  echo "$file"
                  cat "$file"
                fi
              done
              timeout 10s docker stats --no-stream --format "{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}} PIDS={{.PIDs}}"
              sleep 30
            done
          ' > "$RUNNER_TEMP/${TARGET}-build-resources.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/${TARGET}-build-resources.pid"

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_${{ env.TARGET }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/xssty123/VeOmni
            org.opencontainers.image.revision=${{ github.sha }}
            ai.veomni.docker-revision=${{ github.sha }}
            ai.veomni.fla-revision=${{ env.FLA_COMMIT }}
            ai.veomni.target=${{ env.TARGET }}
          cache-from: type=gha,scope=ascend-${{ env.TARGET }}-cann921
          cache-to: type=gha,scope=ascend-${{ env.TARGET }}-cann921,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/${TARGET}-build-resources.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/${TARGET}-build-resources.pid")" 2>/dev/null || true
          fi
          mkdir -p "$RUNNER_TEMP/${TARGET}-build-diagnostics"
          if [ -f "$RUNNER_TEMP/${TARGET}-build-resources.log" ]; then
            cp "$RUNNER_TEMP/${TARGET}-build-resources.log" "$RUNNER_TEMP/${TARGET}-build-diagnostics/"
            tail -n 80 "$RUNNER_TEMP/${TARGET}-build-resources.log"
          fi
          if [ -f "$RUNNER_TEMP/${TARGET}-build-started-at" ]; then
            sudo journalctl -k --since "@$(cat "$RUNNER_TEMP/${TARGET}-build-started-at")" --no-pager \
              > "$RUNNER_TEMP/${TARGET}-build-diagnostics/kernel.log" 2>&1 || true
          fi
          free -h > "$RUNNER_TEMP/${TARGET}-build-diagnostics/final-memory.txt" 2>&1 || true
          df -h > "$RUNNER_TEMP/${TARGET}-build-diagnostics/final-disk.txt" 2>&1 || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-build-diagnostics
          path: ${{ runner.temp }}/${{ env.TARGET }}-build-diagnostics/
          if-no-files-found: warn

  validate-candidate:
    needs: build-candidate
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Login to candidate GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check exact digest in a fresh container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test -n "$IMAGE_DIGEST"
          docker pull "$IMAGE@$IMAGE_DIGEST"
          docker image inspect "$IMAGE@$IMAGE_DIGEST" > reports/${TARGET}-image-inspect.json
          docker run --name "${TARGET}-candidate-smoke" --entrypoint /bin/bash \
            --mount "type=bind,src=$PWD/docker/ascend/tests/ascend_image_smoke.py,dst=/tmp/ascend_image_smoke.py,readonly" \
            --mount "type=bind,src=$PWD/reports/${TARGET}-image-inspect.json,dst=/tmp/${TARGET}-image-inspect.json,readonly" \
            -e DOCKER_SOURCE_COMMIT="$GITHUB_SHA" \
            -e TARGET="$TARGET" \
            -e TORCH_DEVICE_BACKEND_AUTOLOAD=0 \
            "$IMAGE@$IMAGE_DIGEST" -c '
              set -eo pipefail
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              python /tmp/ascend_image_smoke.py \
                --image-inspect /tmp/${TARGET}-image-inspect.json \
                --expected-docker-commit "$DOCKER_SOURCE_COMMIT" \
                --target "$TARGET" \
                --output /tmp/${TARGET}-smoke.json
            ' 2>&1 | tee reports/${TARGET}-smoke.log

      - name: Collect image evidence
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          if docker inspect "${TARGET}-candidate-smoke" >/dev/null 2>&1; then
            for file in /tmp/${TARGET}-smoke.json \
              /app/${TARGET}-image-requirements.txt /app/${TARGET}-ci-wheels.sha256; do
              docker cp "${TARGET}-candidate-smoke:$file" reports/ || true
            done
            docker rm "${TARGET}-candidate-smoke"
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-candidate-smoke
          path: reports/
          if-no-files-found: error

  record-result:
    if: always() && github.repository == 'xssty123/VeOmni' && inputs.mode == 'full'
    needs: [build-candidate, validate-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.build-candidate.outputs.tag }}
      IMAGE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
      BUILD_RESULT: ${{ needs.build-candidate.result }}
      SMOKE_RESULT: ${{ needs.validate-candidate.result }}
    steps:
      - name: Download available smoke evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.TARGET }}-candidate-smoke
          path: reports

      - name: Record candidate result
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          target = env['TARGET']
          smoke_file = Path(f'reports/{target}-smoke.json')
          smoke = json.loads(smoke_file.read_text()) if smoke_file.exists() else None
          passed = env['BUILD_RESULT'] == env['SMOKE_RESULT'] == 'success'
          passed = passed and smoke is not None and smoke.get('status') == 'passed'
          result = {
              'commit': env['GITHUB_SHA'],
              'veomni_commit': env['GITHUB_SHA'],
              'fla_commit': env['FLA_COMMIT'],
              'run_url': f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
              'target': f'{target}-arm64',
              'platform': 'linux/arm64',
              'dockerfile': f'docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_{target}',
              'image': env['IMAGE'],
              'tag': env['IMAGE_TAG'],
              'digest': env['IMAGE_DIGEST'],
              'build_result': env['BUILD_RESULT'],
              'smoke_result': env['SMOKE_RESULT'],
              'packaging_smoke_passed': passed,
              'dependency_consistent': smoke.get('dependency_consistent') if smoke else None,
              'npu_ut_st': 'not_run',
              'smoke': smoke,
          }
          Path('reports/ascend-candidate-result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(env['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### {target.upper()} CANN 9.2.1 candidate\n\n')
              summary.write(f"Image: `{env['IMAGE']}@{env['IMAGE_DIGEST']}`\n\n")
              summary.write(f"Build: {env['BUILD_RESULT']}; packaging smoke: {passed}\n\n")
              summary.write(f"Dependency consistency: {result['dependency_consistent']}\n\n")
              summary.write('NPU UT/ST: not run. This is not a hardware acceptance result.\n')
          PY

      - name: Upload candidate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-candidate-result
          path: reports/
          if-no-files-found: error

      - name: Require complete smoke evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reports/ascend-candidate-result.json').read_text())
          if not result['packaging_smoke_passed']:
              raise SystemExit('Candidate build/smoke failed or evidence is incomplete')
          PY

  diagnose:
    if: github.repository == 'xssty123/VeOmni' && (inputs.mode == 'diagnose-kda' || inputs.mode == 'diagnose-fla')
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      DIAG_MODE: ${{ inputs.mode }}
      REPORT_DIR: ${{ runner.temp }}/a5-${{ inputs.mode }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check pinned build source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "git checkout --detach $FLA_COMMIT" docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_a5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=134217728
            env.BUILDKIT_STEP_LOG_MAX_SPEED=1048576

      - name: Build the existing FLA dependency environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_a5
          target: fla-build-env
          platforms: linux/arm64
          load: true
          push: false
          tags: veomni-a5-kda-diagnostic:local
          cache-from: |
            type=gha,scope=ascend-a5-cann921-diagnostic
            type=gha,scope=ascend-a5-cann921
          cache-to: type=gha,scope=ascend-a5-cann921-diagnostic,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple

      - name: Diagnose FLA with four compilation jobs and live resource logs
        shell: bash
        env:
          DIAG_IMAGE: veomni-a5-kda-diagnostic:local
        run: bash docker/ascend/tests/diagnose_a5_kda.sh

      - name: Summarize diagnostic only
        if: always()
        shell: bash
        run: |
          {
            echo '### A5 FLA compilation diagnostic'
            echo 'This run does not build or validate a complete image or execute NPU tests.'
            if [ -f "$REPORT_DIR/diagnostic-result.json" ]; then
              echo '```json'
              cat "$REPORT_DIR/diagnostic-result.json"
              echo '```'
            else
              echo 'No completed diagnostic record; inspect the preparation/build logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FLA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-${{ inputs.mode }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
