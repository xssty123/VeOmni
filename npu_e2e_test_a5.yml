# # Tests layout

name: A5 local NPU system tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      - "!scripts/**/*.py"
      - npu_e2e_test_a5.yml
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "!scripts/**/*.py"
      - npu_e2e_test_a5.yml
      - "pyproject.toml"
      - "uv.lock"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

jobs:
  npu_e2e_tests:
    name: VeOmni A5 local ST
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 90
    container:
      image: a5-veomni-b060:v1
      env:
        ASCEND_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
        ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
      volumes:
      - /home/z00832855/latest_proxy:/tmp/latest_proxy:ro
      - /home:/home
      - /root/ascend:/root/ascend
      - /etc/ascend_install.info:/etc/ascend_install.info
      - /etc/hccn.conf:/etc/hccn.conf
      - /usr/bin/msnpureport:/usr/bin/msnpureport
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/lib64/libnl-genl-3.so.200:/usr/lib64/libnl-genl-3.so.200
      - /data_2:/data_2
      - /data_1:/data_1
      - /root/.cache/:/root/.cache/
      - /autotest:/autotest
      - /usr/lib64/libnl-3.so.200:/usr/lib64/libnl-3.so.200
      - /home/data:/home/data
      - /mnt:/mnt
      - /pta_data:/pta_data
      - /usr/lib64/urma:/usr/lib64/urma
      - /data:/data
      - /data1:/data1
      - /data_euleros/data1:/data_euleros/data1
      - /usr/lib64/liburma_common.so:/usr/lib64/liburma_common.so
      - /usr/lib64/liburma_common.so.0:/usr/lib64/liburma_common.so.0
      - /usr/lib64/liburma_common.so.0.0.1:/usr/lib64/liburma_common.so.0.0.1
      - /usr/lib64/liburma.so:/usr/lib64/liburma.so
      - /usr/lib64/liburma.so.0:/usr/lib64/liburma.so.0
      - /usr/lib64/liburma.so.0.0.3:/usr/lib64/liburma.so.0.0.3
      - /usr/lib64/libummu.so.1:/usr/lib64/libummu.so.1
      - /usr/lib64/libummu.so.1.0.5:/usr/lib64/libummu.so.1.0.5
      - /dev/log:/dev/log
      options: --privileged --ipc=host --shm-size=720g --device=/dev/hisi_hdc --device=/dev/davinci_manager --device=/dev/davinci0
        --device=/dev/davinci1 --device=/dev/davinci2 --device=/dev/davinci3 --device=/dev/davinci4 --device=/dev/davinci5
        --device=/dev/davinci6 --device=/dev/davinci7 --device=/dev/uburma --device=/dev/ummu
    env:
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      # Shared NFS paths (see workflow container.volumes and
      # github_runner/group_vars/all.yml::veomni_ci_nfs_*).
      CI_HF_MODELS_DIR: "/home/z00832855/ci/ut/models"
      CI_SAMPLES_DIR: "/home/z00832855/ci/ut/samples"
      CI_DATASET_DIR: "/home/z00832855/ci/ut/datasets"
      # uv's default 30s timeout fires intermittently on the CN runners
      # while pulling large wheels (e.g. torch-npu, virtualenv); bump to
      # 5 min so a slow link doesn't fail the whole sync.
      UV_HTTP_TIMEOUT: "300"
      # CANN 9.0.0: let OS assign HCCL ports (auto) to avoid port exhaustion
      # and counter overflow to 65536 when many sub-communicators run sequentially.
      HCCL_HOST_SOCKET_PORT_RANGE: "auto"
      HCCL_NPU_SOCKET_PORT_RANGE: "auto"

    steps:
      - name: Initialize A5 environment
        shell: bash
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          export LD_LIBRARY_PATH="/usr/lib64/:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64/common:/usr/lib/aarch64-linux-gnu/:${LD_LIBRARY_PATH:-}"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Set up proxy
        run: |
          CURRENT_PROXY=$(cat /tmp/latest_proxy)
          echo "HTTP_PROXY=$CURRENT_PROXY" >> $GITHUB_ENV
          echo "HTTPS_PROXY=$CURRENT_PROXY" >> $GITHUB_ENV
          echo "http_proxy=$CURRENT_PROXY" >> $GITHUB_ENV
          echo "https_proxy=$CURRENT_PROXY" >> $GITHUB_ENV
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Check initial pip list from image
        run: |
          pip list
      - name: Checkout ByteDance-Seed/VeOmni repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Sync dependencies
        run: |
          # uv sync --system-certs --frozen --python 3.12 --extra npu_aarch64 --group dev
          uv sync --locked --python 3.12 --extra npu_aarch64 --group dev --allow-insecure-host github.com --allow-insecure-host objects.githubusercontent.com --allow-insecure-host download-r2.pytorch.org

      - name: Install torch_npu with pip
        run: |
          uv pip install --python .venv/bin/python pip
          # Temporary host-scoped TLS exceptions until the runner CA trust is configured.
          .venv/bin/python -m pip install --no-deps --force-reinstall \
            --index-url https://ascend.devcloud.huaweicloud.com/pypi/simple/ \
            --trusted-host ascend.devcloud.huaweicloud.com "torch-npu==2.10.0.post6"
      - name: Install triton-ascend with pip
        run: |
          # Install the base before the Ascend overlay, which replaces libtriton.so.
          .venv/bin/python -m pip uninstall -y triton triton-ascend
          .venv/bin/python -m pip install --no-deps \
            --index-url https://pypi.org/simple \
            --trusted-host pypi.org --trusted-host files.pythonhosted.org "triton==3.5.0"
          .venv/bin/python -m pip install --no-deps --force-reinstall \
            --trusted-host mirrors.huaweicloud.com \
            "https://mirrors.huaweicloud.com/ascend/repos/pypi/triton-ascend/triton_ascend-3.2.2-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl"
      - name: Install fla_npu from local wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall /app/flash_linear_attention_npu-*.whl
          uv pip install --python .venv/bin/python --system-certs --index-url https://pypi.org/simple pybind11 wheel setuptools cmake ninja
      - name: Install torchcodec from local source
        shell: bash
        run: |
          ASCEND_ENV="${ASCEND_ENV:-/usr/local/Ascend/ascend-toolkit/set_env.sh}"
          source "$ASCEND_ENV"
          uv pip install --python .venv/bin/python pip
          source .venv/bin/activate
          cd "${TORCHCODEC_SOURCE_DIR:-/app/torchcodec}"
          PIP_INDEX_URL=https://pypi.org/simple \
            PIP_TRUSTED_HOST="pypi.org files.pythonhosted.org" \
            bash install_torchcodec_Ascend.sh "$ASCEND_ENV"
          # Exports in the installer subprocess do not persist in this shell.
          export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib64:${LD_LIBRARY_PATH:-}"
          python -c "import torchcodec; from torchcodec.decoders import VideoDecoder; print(torchcodec.__file__); print('VideoDecoder import: Success')"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Install transformers 5.9.0
        run: |
          uv pip install --python .venv/bin/python --no-deps "transformers==5.9.0"
      - name: Check final pip list
        run: |
          uv pip list --python .venv/bin/python
      - name: Validate NPU GDN dependencies
        shell: bash
        run: |
          source "${ASCEND_ENV:-/usr/local/Ascend/ascend-toolkit/set_env.sh}"
          export HCCL_OP_EXPANSION_MODE=AICPU_CacheDisable
          uv run --no-sync python -m pytest -v -s -x tests/ops/test_fla_npu_installation_contract.py
      - name: Run e2e training test
        shell: bash
        run: |
          source "${ASCEND_ENV:-/usr/local/Ascend/ascend-toolkit/set_env.sh}"
          export HCCL_OP_EXPANSION_MODE=AICPU_CacheDisable
          uv run --no-sync python -m pytest -v -s -x tests/e2e/test_e2e_parallel.py
      - name: Free NPUs between test steps
        # pytest's mp.spawn / torchrun workers sometimes outlive the pytest
        # session — they hold tens of GiB on NPU and OOM the next test.
        # Kill stale Python processes and verify NPU memory is freed.
        if: always()
        run: |
          npu-smi info || true
          pids=$(ps -eo pid,args | grep -E 'python.*torchrun|python.*pytest' | grep -v grep | awk '{print $1}' | sort -u | tr '\n' ' ')
          if [ -n "$pids" ]; then
            echo "Killing stale NPU processes: $pids"
            kill -9 $pids 2>/dev/null || true
            sleep 3
            npu-smi info || true
          fi
      - name: Run FSDP equivalence tests
        shell: bash
        run: |
          source "${ASCEND_ENV:-/usr/local/Ascend/ascend-toolkit/set_env.sh}"
          export HCCL_OP_EXPANSION_MODE=AICPU_CacheDisable
          uv run --no-sync python -m pytest -v -s -x tests/distributed/test_fsdp_equivalence.py
      - name: Free NPUs between test steps
        if: always()
        run: |
          npu-smi info || true
          pids=$(ps -eo pid,args | grep -E 'python.*torchrun|python.*pytest' | grep -v grep | awk '{print $1}' | sort -u | tr '\n' ' ')
          if [ -n "$pids" ]; then
            echo "Killing stale NPU processes: $pids"
            kill -9 $pids 2>/dev/null || true
            sleep 3
            npu-smi info || true
          fi
      - name: Run diffusers tests
        shell: bash
        run: |
          source "${ASCEND_ENV:-/usr/local/Ascend/ascend-toolkit/set_env.sh}"
          export HCCL_OP_EXPANSION_MODE=AICPU_CacheDisable
          uv run --no-sync python -m pytest -v -s -x tests/e2e/test_e2e_parallel.py::test_wan_dit_parallel_align
